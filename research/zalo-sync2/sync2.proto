// ---- Sync2.Shared (module N3ek) --------------------------------------------
package Sync2.Shared;

enum PlatformType {
  PLATFORM_TYPE_UNSPECIFIED = 0;
  PLATFORM_TYPE_MOBILE = 1;
  PLATFORM_TYPE_WEB = 2;
  PLATFORM_TYPE_PC = 3;
  PLATFORM_TYPE_SYSTEM = 4;
