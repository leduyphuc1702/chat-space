  string data = 2;
}

// ---- Sync2.Conversation (module Ho1Y) --------------------------------------
package Sync2.Conversation;

enum ConvType {
  CONV_TYPE_UNSPECIFIED = 0;
  CONV_TYPE_ONEONE = 1;
