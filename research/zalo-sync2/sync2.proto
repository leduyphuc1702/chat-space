}

message Partition {
  string id = 1;                            // "oneone/<globalId>" or "group/<globalId>" (see SPEC 7.2)
  repeated Message messages = 2;
}

message Message {
  string sender_id = 1;
  uint64 client_id = 2;                     // cliMsgId (jspb: JS number)
