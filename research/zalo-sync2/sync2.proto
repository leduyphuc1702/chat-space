package Sync2.Message;

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_FAIL = 1;
  MESSAGE_STATUS_SENDING = 2;
  MESSAGE_STATUS_SENT = 3;
  MESSAGE_STATUS_RECEIVED = 4;
  MESSAGE_STATUS_SEEN = 5;
}

message SyncChunk {
  Sync2.Shared.PlatformType platform = 1;   // enum; app serializer writes PLATFORM_TYPE_PC (3)
